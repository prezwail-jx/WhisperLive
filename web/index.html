<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WhisperLive 中英同传</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="shell">
      <section class="control-panel" aria-label="连接控制">
        <div class="brand">
          <div>
            <p class="eyebrow">WhisperLive</p>
            <h1>中英同传面板</h1>
          </div>
          <span id="connectionStatus" class="status idle">未连接</span>
        </div>

        <form id="settingsForm" class="settings">
          <label>
            Server
            <input id="serverInput" type="text" value="ws://localhost:9090" autocomplete="off">
          </label>
          <label>
            会议号
            <input id="meetingNameInput" type="text" maxlength="80" placeholder="如 2026产品会" autocomplete="off">
          </label>
          <label>
            源语言
            <select id="languageInput">
              <option value="" selected>自动识别</option>
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select>
          </label>
        </form>

        <section class="hotword-panel" aria-label="会议热词表">
          <div class="hotword-head">
            <div>
              <h2>会议热词文件</h2>
              <p id="hotwordStatus" class="field-hint">服务端按会议号匹配 txt；开始时自动加载并锁定。</p>
            </div>
            <button id="refreshMeetingsButton" type="button">刷新</button>
          </div>
          <label>
            选择已有热词文件
            <select id="meetingSelectInput">
              <option value="">手动填写会议号</option>
            </select>
          </label>
        </section>

        <div class="actions">
          <button id="startButton" type="button">开始</button>
          <button id="stopButton" type="button" disabled>停止</button>
          <button id="exportLogButton" type="button">导出日志</button>
          <button id="generateSummaryButton" type="button" disabled>生成总结</button>
          <button id="downloadSummaryButton" type="button" disabled>下载总结</button>
          <button id="clearLogButton" type="button">清空日志</button>
        </div>

        <div class="meta-grid">
          <div>
            <span>识别语言</span>
            <strong id="languageStatus">等待中</strong>
          </div>
        </div>
      </section>

      <section class="transcript-grid" aria-label="同传内容">
        <article class="pane source-pane">
          <header>
            <span>原文</span>
            <button id="clearSourceButton" type="button">清空</button>
          </header>
          <div id="sourceText" class="text-stream muted">等待语音输入...</div>
        </article>

        <article class="pane translation-pane">
          <header>
            <span>翻译</span>
            <button id="clearTranslationButton" type="button">清空</button>
          </header>
          <div id="translationText" class="text-stream muted">等待翻译结果...</div>
        </article>
      </section>
    </main>

    <script src="./app.js?v=low-energy-1"></script>
  </body>
</html>
